// Opt-in only; use isolated outputs so verification classes never enter normal jars.
import groovy.json.JsonSlurper
import groovy.json.JsonOutput

gradle.projectsLoaded {
    if (gradle.rootProject.findProject(':fabric') == null) return
    gradle.rootProject.allprojects { project ->
        project.layout.buildDirectory.set(new File(project.rootDir, 'build/mob-list-verification/' + project.name))
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.findProject(':fabric') == null) return
    def loader = System.getProperty('msc.verify.loader', 'fabric')
    def target = root.project(':' + loader)
    def runDirectory = root.file('build/mob-list-run-' + loader)
    target.tasks.withType(JavaExec).configureEach {
        if (name == 'runServer') {
            javaLauncher.set(target.javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(Integer.parseInt(root.property('java_version')))
            })
        }
    }
    target.tasks.named('compileJava').configure {
        source root.file('verification/mob-list/src/common')
        source root.file('verification/mob-list/src/' + loader)
    }
    if (loader == 'fabric') {
        target.tasks.named('processResources').configure {
            doLast {
                def metadata = new File(destinationDir, 'fabric.mod.json')
                def json = new JsonSlurper().parse(metadata)
                json.entrypoints.main.add('com.mobspawncontroller.verification.MobListVerificationFabric')
                metadata.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
            }
        }
        target.loom.runs.server.runDir(target.projectDir.toPath().relativize(runDirectory.toPath()).toString())
        target.loom.runs.server.programArgs('--nogui')
    } else if (loader == 'forge') {
        target.minecraft.runs.server.workingDirectory = runDirectory
        target.minecraft.runs.server.args '--nogui'
    } else {
        target.neoForge.runs.server.gameDirectory = runDirectory
        target.neoForge.runs.server.programArgument('--nogui')
    }
}
